services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - public
      - backend

  minio:
    image: pgsty/silo
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - public
      - backend

  kafka:
    image: apache/kafka:4.4.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9094"
    env_file:
      - .env
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 12
    networks:
      - public
      - backend

  kafka-init:
    image: apache/kafka:4.4.0
    restart: on-failure
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command:
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - ${KAFKA_NOTIFICATIONS_TOPIC}
      - --partitions
      - "1"
      - --replication-factor
      - "1"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - public
      - backend

  auth:
    build:
      context: ..
      dockerfile: .docker/DockerfileAuth
    restart: unless-stopped
    command: uvicorn src.auth.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ../src/auth:/app/src/auth
      - ../src/infrastructure:/app/src/infrastructure
    networks:
      - public
      - backend

  profile:
    build:
      context: ..
      dockerfile: .docker/DockerfileProfile
    restart: unless-stopped
    command: uvicorn src.profile.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    env_file:
      - .env
    volumes:
      - ../src/profile:/app/src/profile
      - ../src/infrastructure:/app/src/infrastructure
    networks:
      - public
      - backend
    depends_on:
      - postgres

  media:
    build:
      context: ..
      dockerfile: .docker/DockerfileMedia
    restart: unless-stopped
    command: uvicorn src.media.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8002:8000"
    env_file:
      - .env
    volumes:
      - ../src/media:/app/src/media
      - ../src/infrastructure:/app/src/infrastructure
    networks:
      - public
      - backend

  notification:
    build:
      context: ..
      dockerfile: .docker/DockerfileNotification
    restart: unless-stopped
    command: uvicorn src.notification.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8004:8000"
    env_file:
      - .env
    volumes:
      - ../src/notification:/app/src/notification
      - ../src/infrastructure:/app/src/infrastructure
    depends_on:
      postgres:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    networks:
      - public
      - backend

  bff:
    build:
      context: ..
      dockerfile: .docker/DockerfileBff
    restart: unless-stopped
    command: uvicorn src.bff.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8003:8000"
    env_file:
      - .env
    volumes:
      - ../src/bff:/app/src/bff
      - ../generated/clients/auth:/app/generated/clients/auth
      - ../generated/clients/profile:/app/generated/clients/profile
      - ../generated/clients/media:/app/generated/clients/media
    networks:
      - public
      - backend
    depends_on:
      - auth
      - profile
      - media

volumes:
  postgres_data:
  minio_data:
  kafka_data:

networks:
  public:
  backend:
    internal: true
