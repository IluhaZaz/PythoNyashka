services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - public
      - backend

  minio:
    image: pgsty/silo
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - public
      - backend

  auth:
    build:
      context: ..
      dockerfile: .docker/DockerfileAuth
    restart: unless-stopped
    command: uvicorn src.auth.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ../src/auth:/app/src/auth
      - ../src/infrastructure:/app/src/infrastructure
    networks:
      - public
      - backend

  profile:
    build:
      context: ..
      dockerfile: .docker/DockerfileProfile
    restart: unless-stopped
    command: uvicorn src.profile.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    env_file:
      - .env
    volumes:
      - ../src/profile:/app/src/profile
      - ../src/infrastructure:/app/src/infrastructure
    networks:
      - public
      - backend
    depends_on:
      - postgres

  media:
    build:
      context: ..
      dockerfile: .docker/DockerfileMedia
    restart: unless-stopped
    command: uvicorn src.media.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8002:8000"
    env_file:
      - .env
    volumes:
      - ../src/media:/app/src/media
      - ../src/infrastructure:/app/src/infrastructure
    networks:
      - public
      - backend

volumes:
  postgres_data:
  minio_data:

networks:
  public:
  backend:
    internal: true