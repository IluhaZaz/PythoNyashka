services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  auth:
    build:
      context: ..
      dockerfile: .docker/DockerfileAuth
    restart: unless-stopped
    command: uvicorn src.auth.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.prod
    volumes:
      - ../src/auth:/app/src/auth
      - ../src/infrastructure:/app/src/infrastructure
    networks:
      - backend

  profile:
    build:
      context: ..
      dockerfile: .docker/DockerfileProfile
    restart: unless-stopped
    command: uvicorn src.profile.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.prod
    volumes:
      - ../src/profile:/app/src/profile
      - ../src/infrastructure:/app/src/infrastructure
    networks:
      - backend

volumes:
  postgres_data:

networks:
  public:
  backend:
    internal: true