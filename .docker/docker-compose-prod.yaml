services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - backend

  auth:
    build:
      context: ..
      dockerfile: .docker/DockerfileAuth
    restart: unless-stopped
    command: uvicorn src.auth.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.prod
    volumes:
      - ../src/auth:/app/src/auth
      - ../src/infrastructure:/app/src/infrastructure
    networks:
      - backend

  profile:
    build:
      context: ..
      dockerfile: .docker/DockerfileProfile
    restart: unless-stopped
    command: uvicorn src.profile.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.prod
    volumes:
      - ../src/profile:/app/src/profile
      - ../src/infrastructure:/app/src/infrastructure
    networks:
      - backend

  media:
    build:
      context: ..
      dockerfile: .docker/DockerfileMedia
    restart: unless-stopped
    command: uvicorn src.media.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.prod
    volumes:
      - ../src/media:/app/src/media
      - ../src/infrastructure:/app/src/infrastructure
    networks:
      - backend

  bff:
    build:
      context: ..
      dockerfile: .docker/DockerfileBff
    restart: unless-stopped
    command: uvicorn src.bff.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8003:8000"
    env_file:
      - .env.prod
    environment:
      BFF_AUTH_BASE_URL: http://auth:8000
      BFF_PROFILE_BASE_URL: http://profile:8000
      BFF_MEDIA_BASE_URL: http://media:8000
    networks:
      - public
      - backend
    depends_on:
      - auth
      - profile
      - media

volumes:
  postgres_data:
  minio_data:


networks:
  public:
  backend:
    internal: true
