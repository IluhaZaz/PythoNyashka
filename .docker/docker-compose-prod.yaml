services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - backend

  auth:
    build:
      context: ..
      dockerfile: .docker/DockerfileAuth
    restart: unless-stopped
    command: uvicorn src.auth.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.prod
    volumes:
      - ../src/auth:/app/src/auth
      - ../src/infrastructure:/app/src/infrastructure
    networks:
      - backend

  media:
    build:
      context: ..
      dockerfile: .docker/DockerfileMedia
    restart: unless-stopped
    command: uvicorn src.media.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.prod
    volumes:
      - ../src/media:/app/src/media
      - ../src/infrastructure:/app/src/infrastructure
    networks:
      - backend

volumes:
  postgres_data:
  minio_data:

networks:
  public:
  backend:
    internal: true