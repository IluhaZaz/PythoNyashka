openapi: 3.0.3
info:
  title: Auth Service API
  description: |
    Microservice responsible for authentication, authorization, and session lifecycle management.
  version: 1.0.0

paths:
  /auth/login:
    post:
      summary: User login
      operationId: login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '422':
          $ref: '#/components/responses/UnprocessableAuthResponse'

  /auth/logout:
    post:
      summary: User logout
      operationId: logout
      tags:
        - Auth
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Successfully logged out
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /auth/register:
    post:
      summary: Register a new user
      operationId: register
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          $ref: '#/components/responses/UserCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '422':
          $ref: '#/components/responses/UnprocessableAuthResponse'

  /auth/refresh:
    post:
      summary: Refresh access token
      operationId: refreshToken
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /auth/password/reset:
    post:
      summary: Request or confirm password reset
      operationId: resetPassword
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          $ref: '#/components/responses/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '422':
          $ref: '#/components/responses/UnprocessableAuthResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "Secret123!"

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "Secret123!"

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          example: "d3b07384d113edec49eaa6238ad5ff00"

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        code:
          type: string
          description: Confirmation code sent to email (if confirming reset)
          example: "123456"
        new_password:
          type: string
          format: password
          description: New password (if confirming reset)
          example: "NewSecret123!"

    AuthTokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token:
          type: string
          example: "d3b07384d113edec49eaa6238ad5ff00"
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          description: Lifetime of access_token in seconds
          example: 3600

  responses:
    AuthTokenResponse:
      description: Tokens generated successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthTokens'

    UserCreatedResponse:
      description: User registered successfully
      content:
        application/json:
          schema:
            type: object
            required: [user_id]
            properties:
              user_id:
                type: string
                format: uuid
                example: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"

    MessageResponse:
      description: Operation succeeded with message
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string
                example: "Password reset instructions have been sent to your email"

    UnauthorizedResponse:
      description: Invalid credentials or expired token
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
                example: "Invalid credentials"

    BadRequestResponse:
      description: Bad request / logical error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
                example: "User with this email already exists"

    UnprocessableAuthResponse:
      description: Request validation error
      content:
        application/json:
          schema:
            type: object
            required: [errors]
            properties:
              errors:
                type: array
                items:
                  type: object
                  required: [field, reason]
                  properties:
                    field:
                      type: string
                      example: "email"
                    reason:
                      type: string
                      example: "Must be a valid email address"